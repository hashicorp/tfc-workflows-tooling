---
name: Go Test
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4.0.0

      - name: Check Go version alignment
        shell: bash
        run: |
          expected=$(cat .go-version)
          module_version=$(awk '$1 == "go" { print $2 }' go.mod)
          docker_version=$(sed -n 's/^FROM golang:\([^ ]*\) AS builder$/\1/p' Dockerfile)
          if [[ "$module_version" != "$expected" || "$docker_version" != "$expected" ]]; then
            echo "::error::Go versions must match: .go-version=$expected, go.mod=$module_version, Dockerfile=$docker_version"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Install dependencies
        run: go get .

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
